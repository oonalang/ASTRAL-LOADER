name: Export KRYVEX Android Source

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked project files
        run: git archive --format=zip --output=KRYVEX-LOADER-FULL-SOURCE.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: KRYVEX-LOADER-FULL-SOURCE
          path: KRYVEX-LOADER-FULL-SOURCE.zip
          if-no-files-found: error
          retention-days: 14
